              <option value="pro23">進階 5-Ban (2+3)</option>
              <option value="free">自由選禁 (排位賽)</option>

          <!-- Win-rate Tug of War -->

            <div class="w-full h-2.5 rounded-full overflow-hidden bg-slate-900 border border-slate-600/60 flex">
              <div id="blueBar" class="h-full transition-all duration-300" style="width:50%; background: linear-gradient(90deg, #0284c7, #38bdf8);"></div>
              <div id="redBar" class="h-full transition-all duration-300" style="width:50%; background: linear-gradient(90deg, #f43f5e, #dc2626);"></div>
            </div>
          </div>
        </div>

        <!-- Red 5-Ban Bar -->
        <div class="lg:col-span-4 space-y-1">
          <div class="flex items-center justify-between text-xs">
            <span id="redHeaderWin" class="font-mono font-bold text-rose-300">50.0%</span>
            <span class="font-bold text-rose-400 flex items-center gap-1.5">
              紅方禁用 (RED BANS <span id="redBanCount">0/5</span>)

            </span>
          </div>
          <div id="redBans" class="grid grid-cols-5 gap-1.5"></div>
        </div>
      </div>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-2.5 items-start">

    function findBestLaneMatching(heroes, allowedLanes = ALL_LANES) {
      const allowedSet = new Set(allowedLanes);
      let bestCount = -1;
      let bestPrimaryScore = -1;
      let bestAssignments = {};

      function backtrack(idx, usedLanes, curAssign, count, primaryScore) {
        if (count + (heroes.length - idx) < bestCount) return;
        if (idx === heroes.length) {
          if (count > bestCount || (count === bestCount && primaryScore > bestPrimaryScore)) {
            bestCount = count;
            bestPrimaryScore = primaryScore;
            bestAssignments = { ...curAssign };
          }
          return;
        }
        const h = heroes[idx];
        let triedAny = false;
        for (let li = 0; li < h.lanes.length; li++) {
          const lane = h.lanes[li];
          if (allowedSet.has(lane) && !usedLanes.has(lane)) {
            triedAny = true;
            usedLanes.add(lane);
            curAssign[h.id] = lane;
            backtrack(idx + 1, usedLanes, curAssign, count + 1, primaryScore + (li === 0 ? 1 : 0));
            usedLanes.delete(lane);
          }
        }
        if (!triedAny || count + (heroes.length - idx - 1) >= bestCount) {
          curAssign[h.id] = h.lanes[0];
          backtrack(idx + 1, usedLanes, curAssign, count, primaryScore);
        }
      }

      backtrack(0, new Set(), {}, 0, 0);
      return { count: Math.max(0, bestCount), assignments: bestAssignments };
    }

          score: 0, curve: [5,5,5], dmgCounts: { AD:0, AP:0, True:0, Tank:0 },
          filled, missing, assignments, coveredCount: 0, confirmedLanes,
          synergies: [], countersHit: [], alerts: [], flexPicks: [],
          engageCount: 0, controlCount: 0, frontlineCount: 0
        };
      }

      let metaSum = 0;
      myHeroes.forEach(h => {
        metaSum += (h.win - 51.0) * 1.35 + (getModeScore(h) - 80) * 0.16;
      });

      let synBonus = 0;
      const synergies = [];
      for (let i = 0; i < myHeroes.length; i++) {
        for (let j = i + 1; j < myHeroes.length; j++) {
          const a = myHeroes[i], b = myHeroes[j];
          if (a.syn.includes(b.id) || b.syn.includes(a.id)) {
            synBonus += 1.65;
            synergies.push(`${a.name}+${b.name}`);
          }
        }
      }

      let ctrBonus = 0;
      const countersHit = [];
      myHeroes.forEach(m => {
        enemyHeroes.forEach(e => {
          if (m.ctr.includes(e.id)) {
            ctrBonus += 1.4;
            countersHit.push(`${m.name}→${e.name}`);
          }
        });
      });

      const dmgCounts = { AD:0, AP:0, True:0, Tank:0 };
      let engageCount = 0, controlCount = 0, frontlineCount = 0;
      let eSum = 0, mSum = 0, lSum = 0;

      myHeroes.forEach(h => {
        dmgCounts[h.dmg] = (dmgCounts[h.dmg] || 0) + 1;
        eSum += h.curve[0];
        mSum += h.curve[1];
        lSum += h.curve[2];
        if (h.tags.some(t => /強開|開戰|開團|進場|突襲/.test(t))) engageCount++;
        if (h.tags.some(t => /控|暈|定身|綁|石|壓制|嘲諷|沉默/.test(t))) controlCount++;
        if (h.cls === '坦克' || h.cls === '戰士' || h.tags.some(t => /坦|前排|扛傷/.test(t))) frontlineCount++;
      });

      const flexPicks = myHeroes
        .filter(h => assignments[h.id] && assignments[h.id] !== h.lanes[0])
        .map(h => `${h.name}(${assignments[h.id]})`);

      let compPenalty = 0;
      const alerts = [];
      const unassignableCount = myHeroes.length - coveredCount;

      if (unassignableCount > 0) {
        compPenalty -= unassignableCount * 1.4;
        alerts.push({ type:'warn', text:`部分角色位置重疊 (${unassignableCount}位)，缺 ${missing.join('、')}` });
      } else if (flexPicks.length > 0) {
        alerts.push({ type:'good', text:`合理彈性搖擺：${flexPicks.join('、')}` });
      }

      if (myHeroes.length >= 4) {
        if (dmgCounts.AP === 0 && dmgCounts.True === 0) {
          compPenalty -= 1.0;
          alerts.push({ type:'warn', text:'純物理傷害為主，注意對手物防裝' });
        } else if (dmgCounts.AD === 0 && dmgCounts.True === 0) {
          compPenalty -= 0.9;
          alerts.push({ type:'warn', text:'偏法傷陣容，推塔需靠節奏或召喚物' });
        }
        if (frontlineCount === 0 && controlCount === 0) {
          compPenalty -= 1.1;
          alerts.push({ type:'warn', text:'缺乏前排與硬控，需靠拉扯陣地作戰' });
        }
      }
      if (synergies.length > 0) {
        alerts.push({ type:'good', text:`體系連動：${synergies.slice(0,2).join('、')}` });
      }

      const n = myHeroes.length;
      return {
        score: metaSum + synBonus + ctrBonus + compPenalty,
        curve: [+(eSum/n).toFixed(1), +(mSum/n).toFixed(1), +(lSum/n).toFixed(1)],
        dmgCounts, filled, missing, assignments, coveredCount, confirmedLanes,
        synergies, countersHit, alerts, flexPicks,
        engageCount, controlCount, frontlineCount
      };
    }

    function computeWinProbability() {
      const blueA = analyzeTeam(state.bluePicks, state.redPicks);
      const redA = analyzeTeam(state.redPicks, state.bluePicks);

      let banShift = 0;
      const blueBanHeroes = state.blueBans.filter(Boolean).map(id => HERO_MAP[id]);
      const redBanHeroes = state.redBans.filter(Boolean).map(id => HERO_MAP[id]);
      const bluePicked = state.bluePicks.filter(Boolean);
      const redPicked = state.redPicks.filter(Boolean);

      blueBanHeroes.forEach(bh => {
        bluePicked.forEach(pid => { if (bh.ctr.includes(pid)) banShift += 0.45; });
        redPicked.forEach(pid => { if (bh.syn.includes(pid)) banShift += 0.45; });
      });
      redBanHeroes.forEach(bh => {
        redPicked.forEach(pid => { if (bh.ctr.includes(pid)) banShift -= 0.45; });
        bluePicked.forEach(pid => { if (bh.syn.includes(pid)) banShift -= 0.45; });
      });

      const rawDiff = (blueA.score - redA.score) + banShift;
      const blueWin = Math.max(18, Math.min(82, 50 + 28 * Math.tanh(rawDiff / 16)));
      return {
        blueWin: +blueWin.toFixed(1),
        redWin: +(100 - blueWin).toFixed(1),
        blueA,
        redA
      };
    }

    function getRecommendations(side, type, laneLimit = '自動') {
      const myPicks = (side === 'blue' ? state.bluePicks : state.redPicks).filter(Boolean);
      const enemyPicks = (side === 'blue' ? state.redPicks : state.bluePicks).filter(Boolean);
      const myAna = analyzeTeam(myPicks, enemyPicks);
      const enemyAna = analyzeTeam(enemyPicks, myPicks);
      const available = HEROES.filter(h => !isHeroUsed(h.id));

      // Confirmed vs still-open positions on the enemy side
      const confirmedEnemyLanes = enemyAna.confirmedLanes;
      const openEnemyLanes = ALL_LANES.filter(l => !confirmedEnemyLanes.has(l));

      if (type === 'ban') {
        return available.map(h => {
          const mScore = getModeScore(h);
          const mTier = getModeTier(h);
          let score = isRankedMode()
            ? (h.ban * 0.80) + (mScore * 0.45) + (h.win - 50) * 3.6
            : (h.ban * 0.55) + (mScore * 0.65) + (h.win - 50) * 2.5;
          const reasons = [];

          // Which of h's lanes are STILL open for the enemy to pick?
          const hOpenLanes = h.lanes.filter(l => openEnemyLanes.includes(l));
          const allEnemyLanesLocked = enemyPicks.length > 0 && hOpenLanes.length === 0;

          if (allEnemyLanesLocked) {
            // Enemy has ALREADY locked all playable positions for this hero -> do NOT waste a ban!
            score -= 70;
            reasons.push(`敵方已鎖定 ${h.lanes.join('/')}，免浪費Ban`);
            return { hero: h, score: +score.toFixed(1), reasons };
          }

          if (enemyPicks.length > 0 && openEnemyLanes.length < 5) {
            if (openEnemyLanes.includes(h.lanes[0])) {
              score += 20;
              reasons.push(`針對敵方缺口：${h.lanes[0]}`);
            } else {
              score += 6;
              reasons.push(`防敵方 ${hOpenLanes[0]} 搖擺`);
            }
          } else if (mTier === 'T0') {
            reasons.push('版本 T0 強勢角');
          }

          const threatensUs = myPicks.filter(pid => h.ctr.includes(pid));
          if (threatensUs.length > 0) {
            score += threatensUs.length * 15;
            reasons.push(`克制我方 ${threatensUs.map(id => HERO_MAP[id].name).join('、')}`);
          }
          const helpsEnemy = enemyPicks.filter(pid => h.syn.includes(pid) || HERO_MAP[pid].syn.includes(h.id));
          if (helpsEnemy.length > 0) {
            score += helpsEnemy.length * (isRankedMode() ? 10 : 16);
            reasons.push(`拆散敵方 ${helpsEnemy.map(id => HERO_MAP[id].name).join('、')} 連動`);
          }
          if (reasons.length === 0) reasons.push(h.note.split('，')[0]);
          return { hero: h, score: +score.toFixed(1), reasons };
        }).sort((a, b) => b.score - a.score);
      }

      return available
        .filter(h => laneLimit === '自動' || laneLimit === '全部' ? true : h.lanes.includes(laneLimit))
        .map(h => {
          const mScore = getModeScore(h);
          const mTier = getModeTier(h);
          let score = isRankedMode()
            ? (mScore * 0.65) + (h.win - 49.0) * 6.0 + (mTier === 'T0' ? 12 : mTier === 'T1' ? 6 : 0)
            : (mScore * 0.72) + (h.win - 49.0) * 4.0 + (mTier === 'T0' ? 12 : mTier === 'T1' ? 6 : 0);
          const reasons = [];

          // Evaluate optimal lane coverage if we add h
          const nextAssign = assignLanes([...myPicks, h.id]);
          const expandsCoverage = nextAssign.coveredCount > myAna.coveredCount;
          const assignedLane = nextAssign.assignments[h.id];

          if (expandsCoverage) {
            score += 20;
            if (assignedLane && assignedLane !== h.lanes[0]) {
              reasons.push(`彈性補齊 ${assignedLane}位`);
            } else {
              reasons.push(`補齊 ${assignedLane || h.lanes[0]}位`);
            }
          } else if (myPicks.length > 0) {
            score -= 16;
          }

          const synHits = myPicks.filter(pid => h.syn.includes(pid) || HERO_MAP[pid].syn.includes(h.id));
          if (synHits.length > 0) {
            score += synHits.length * (isRankedMode() ? 10 : 16);
            reasons.push(`連動 ${synHits.map(id => HERO_MAP[id].name).join('+')}`);
          }
          const ctrHits = enemyPicks.filter(eid => h.ctr.includes(eid));
          if (ctrHits.length > 0) {
            score += ctrHits.length * 14;
            reasons.push(`康特 ${ctrHits.map(id => HERO_MAP[id].name).join('、')}`);
          }
          // Penalize only if enemy ALREADY picked a counter OR still has an open lane to pick a counter
          const counteredByEnemy = enemyPicks.filter(eid => HERO_MAP[eid].ctr.includes(h.id));
          if (counteredByEnemy.length > 0) {
            score -= counteredByEnemy.length * 10;
          }
          if (myPicks.length >= 2) {
            if (myAna.dmgCounts.AP === 0 && (h.dmg === 'AP' || h.dmg === 'True')) {
              score += 7;
              reasons.push('補足法術/真傷');
            }
            if (myAna.frontlineCount === 0 && (h.cls === '坦克' || h.cls === '戰士')) {
              score += 8;
              reasons.push('補強前排坦度');
            }
            if (myAna.engageCount === 0 && h.tags.some(t => /強開|開團/.test(t))) {
              score += 6;
              reasons.push('提供強開控制');
            }
          }
          if (reasons.length === 0) reasons.push(`${mTier} 強勢・勝率 ${h.win}%`);
          return { hero: h, score: +score.toFixed(1), reasons };
        })
        .sort((a, b) => b.score - a.score);
    }

    // =========================================================================
    // 5. ACTIONS
    // =========================================================================
    function previewOrLockHero(heroId) {
      if (isHeroUsed(heroId)) return;
      const act = getActiveAction();
      if (!act) return;
      if (state.instantLock || state.pendingHeroId === heroId) {
        applyHeroSelection(heroId);
      } else {
        state.pendingHeroId = heroId;
        renderPreviewBar();
        renderHeroPool();
      }
    }

    function applyHeroSelection(heroId) {
      if (isHeroUsed(heroId)) return;
      const act = getActiveAction();
      if (!act) return;

      state.history.push(snapshot());
      if (act.side === 'blue' && act.type === 'ban') state.blueBans[act.slot] = heroId;
      if (act.side === 'red' && act.type === 'ban') state.redBans[act.slot] = heroId;
      if (act.side === 'blue' && act.type === 'pick') state.bluePicks[act.slot] = heroId;
      if (act.side === 'red' && act.type === 'pick') state.redPicks[act.slot] = heroId;

      state.pendingHeroId = null;
      const prob = computeWinProbability();
      if (state.mode === 'free') {
        state.winHistory.push(prob.blueWin);
        advanceFreeTarget();
      } else {
        const seq = SEQUENCES[state.mode];
        const nextIdx = seq.findIndex(s => {
          const arr = state[s.side + (s.type === 'ban' ? 'Bans' : 'Picks')];
          return arr[s.slot] === null;
        });
        state.stepIdx = nextIdx === -1 ? seq.length : nextIdx;
        state.winHistory.push(prob.blueWin);
      }
      render();
    }

    function advanceFreeTarget() {
      const order = [
        ...Array.from({length:5}, (_,i)=>({side:'blue',type:'ban',slot:i})),
        ...Array.from({length:5}, (_,i)=>({side:'red',type:'ban',slot:i})),
        ...Array.from({length:5}, (_,i)=>({side:'blue',type:'pick',slot:i})),
        ...Array.from({length:5}, (_,i)=>({side:'red',type:'pick',slot:i}))
      ];
      const next = order.find(o => state[o.side + (o.type === 'ban' ? 'Bans' : 'Picks')][o.slot] === null);
      if (next) state.freeTarget = next;
    }

    function clearSlot(side, type, slot) {
      const arrName = side + (type === 'ban' ? 'Bans' : 'Picks');
      if (state[arrName][slot] === null) {
        if (state.mode === 'free') {
          state.freeTarget = { side, type, slot };
          state.pendingHeroId = null;
          render();
        }
        return;
      }
      state.history.push(snapshot());
      state[arrName][slot] = null;
      state.pendingHeroId = null;

      if (state.mode !== 'free') {
        const seq = SEQUENCES[state.mode];
        const nextIdx = seq.findIndex(s => {
          const arr = state[s.side + (s.type === 'ban' ? 'Bans' : 'Picks')];
          return arr[s.slot] === null;
        });
        state.stepIdx = nextIdx === -1 ? seq.length : nextIdx;
        state.winHistory.push(computeWinProbability().blueWin);
      } else {
        state.freeTarget = { side, type, slot };
        state.winHistory.push(computeWinProbability().blueWin);
      }
      render();
    }

    function undo() {
      if (state.history.length === 0) return;
      restore(state.history.pop());
      render();
    }

    function aiStep() {
      const act = getActiveAction();
      if (!act) return;
      const recs = getRecommendations(act.side, act.type, '自動');
      if (recs.length > 0) applyHeroSelection(recs[0].hero.id);
    }

    function swapSides() {
      state.history.push(snapshot());
      [state.blueBans, state.redBans] = [state.redBans, state.blueBans];
      [state.bluePicks, state.redPicks] = [state.redPicks, state.bluePicks];
      state.winHistory = state.winHistory.map(w => +(100 - w).toFixed(1));
      state.pendingHeroId = null;
      render();
    }

    function resetDraft() {
      state.blueBans = Array(5).fill(null);
      state.redBans = Array(5).fill(null);
      state.bluePicks = Array(5).fill(null);
      state.redPicks = Array(5).fill(null);
      state.stepIdx = 0;
      state.freeTarget = { side:'blue', type:'ban', slot:0 };
      state.pendingHeroId = null;
      state.history = [];
      state.winHistory = [50.0];
      render();
    }

    function renderTrendChart() {
      const wrap = document.getElementById('trendChartWrap');
      const pts = state.winHistory;
      const w = 420, h = 108;
      const padL = 28, padR = 10, padT = 8, padB = 18;
      const plotW = w - padL - padR;
      const plotH = h - padT - padB;
      const maxSteps = 20;

      const xOf = i => padL + (i / maxSteps) * plotW;
      const yOf = val => padT + ((80 - Math.max(20, Math.min(80, val))) / 60) * plotH;

      const pathD = pts.map((v, i) => `${i === 0 ? 'M' : 'L'} ${xOf(i).toFixed(1)} ${yOf(v).toFixed(1)}`).join(' ');
      const areaD = pathD + ` L ${xOf(pts.length - 1).toFixed(1)} ${yOf(50).toFixed(1)} L ${xOf(0).toFixed(1)} ${yOf(50).toFixed(1)} Z`;

      const lastVal = pts[pts.length - 1];
      const delta = +(lastVal - 50).toFixed(1);
      document.getElementById('trendDelta').textContent =
        delta === 0 ? '基準 50.0%' : `藍方 ${lastVal}% (${delta > 0 ? '+' : ''}${delta}%)`;

      wrap.innerHTML = `
        <svg viewBox="0 0 ${w} ${h}" class="w-full h-full overflow-visible">
          <line x1="${padL}" y1="${yOf(65)}" x2="${w-padR}" y2="${yOf(65)}" stroke="#334155" stroke-dasharray="3 3" stroke-width="1"/>
          <line x1="${padL}" y1="${yOf(50)}" x2="${w-padR}" y2="${yOf(50)}" stroke="#94a3b8" stroke-dasharray="4 3" stroke-width="1"/>
          <line x1="${padL}" y1="${yOf(35)}" x2="${w-padR}" y2="${yOf(35)}" stroke="#334155" stroke-dasharray="3 3" stroke-width="1"/>
          <text x="2" y="${yOf(65)+4}" fill="#94a3b8" font-size="10">65%</text>
          <text x="2" y="${yOf(50)+4}" fill="#cbd5e1" font-size="10">50%</text>
          <text x="2" y="${yOf(35)+4}" fill="#94a3b8" font-size="10">35%</text>
          <path d="${areaD}" fill="#38bdf8" fill-opacity="0.18" />
          <path d="${pathD}" fill="none" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
          ${pts.map((v, i) => `
            <circle cx="${xOf(i).toFixed(1)}" cy="${yOf(v).toFixed(1)}" r="${i === pts.length - 1 ? 3.8 : 2.3}"
              fill="${v >= 50 ? '#38bdf8' : '#fb7185'}" />
          `).join('')}
          <text x="${padL}" y="${h-3}" fill="#94a3b8" font-size="10">R1 Ban</text>
          <text x="${xOf(8)}" y="${h-3}" fill="#94a3b8" font-size="10">R1 Pick</text>
          <text x="${xOf(14)}" y="${h-3}" fill="#94a3b8" font-size="10">R2 Ban</text>
          <text x="${xOf(18)}" y="${h-3}" fill="#94a3b8" font-size="10">尾選</text>
        </svg>
      `;
    }

    function renderPhaseBars(blueA, redA) {
      const phases = [
        { label: '前期 (0-6m)', b: blueA.curve[0], r: redA.curve[0] },
        { label: '中期 (6-12m)', b: blueA.curve[1], r: redA.curve[1] },
        { label: '後期 (12m+)', b: blueA.curve[2], r: redA.curve[2] }
      ];
      document.getElementById('phaseBars').innerHTML = phases.map(p => {
        const tot = Math.max(1, p.b + p.r);
        const bp = (p.b / tot) * 100;
        return `
          <div class="space-y-1">
            <div class="flex justify-between text-xs font-mono">
              <span class="text-sky-400 font-bold">${p.b}</span>
              <span class="text-slate-300 font-sans">${p.label}</span>
              <span class="text-rose-400 font-bold">${p.r}</span>
            </div>
            <div class="w-full h-1.5 rounded-full overflow-hidden bg-slate-800 flex">
              <div style="width:${bp}%; background:#38bdf8"></div>
              <div style="width:${100-bp}%; background:#fb7185"></div>
            </div>
          </div>
        `;
      }).join('');
    }

    function renderRecommendations(prob) {
      const act = getActiveAction();
      const titleEl = document.getElementById('recTitle');
      const subEl = document.getElementById('recSubtitle');
      const filterWrap = document.getElementById('recFilterWrap');
      const alertsEl = document.getElementById('compAlerts');
      const listEl = document.getElementById('recList');

      if (!act) {
        titleEl.textContent = 'BP 已完成！最終陣容勝負評估';
        subEl.textContent = `藍方預估勝率 ${prob.blueWin}% vs 紅方 ${prob.redWin}%`;
        filterWrap.innerHTML = '';
        const allAlerts = [
          ...prob.blueA.alerts.map(a => ({ ...a, side:'藍方' })),
          ...prob.redA.alerts.map(a => ({ ...a, side:'紅方' }))
        ];
        alertsEl.innerHTML = allAlerts.length
          ? allAlerts.map(a => `<span class="px-2 py-0.5 rounded-full text-xs border border-slate-700 bg-slate-900/80 ${a.type==='warn'?'text-amber-300':'text-emerald-400'}">${a.side}：${a.text}</span>`).join('')
          : '<span class="text-xs text-emerald-400">雙方陣容配置完整均衡，進入艾森諾戰場實戰節奏比拼！</span>';
        listEl.innerHTML = `
          <div class="sm:col-span-2 p-2.5 rounded-lg bg-[#070d1c] border border-amber-500/30 text-xs space-y-1 text-slate-200">
            <div class="font-bold text-amber-300">戰術總結：</div>
            <div>• 藍方前中後期戰力：<span class="font-mono text-sky-300">${prob.blueA.curve.join(' / ')}</span>｜紅方前中後期戰力：<span class="font-mono text-rose-300">${prob.redA.curve.join(' / ')}</span></div>
            <div>• ${prob.blueA.curve[0] > prob.redA.curve[0] ? '藍方前期入侵與線權較強，宜主動搶魔龍與野區節奏。' : '紅方前期碰撞較強，藍方應穩住發育待關鍵大招裝備成型。'}</div>
          </div>
        `;
        return;
      }

      const sideName = act.side === 'blue' ? '藍方' : '紅方';
      const ana = act.side === 'blue' ? prob.blueA : prob.redA;
      const enemyAna = act.side === 'blue' ? prob.redA : prob.blueA;
      const enemyConfirmed = [...enemyAna.confirmedLanes];
      const enemyOpen = ALL_LANES.filter(l => !enemyAna.confirmedLanes.has(l));

      if (act.type === 'ban') {
        titleEl.textContent = `戰術教練：${sideName} Ban 位推薦`;
        subEl.textContent = enemyConfirmed.length > 0
          ? `敵方已確切鎖定 [${enemyConfirmed.join('、')}] → 聚焦封鎖敵方尚缺位置 [${enemyOpen.join('、')}]`
          : '優先封鎖版本 T0 怪物、對手體系連動與我方陣容天敵';
        filterWrap.innerHTML = '';
      } else {
        titleEl.textContent = `戰術教練：${sideName} 後續選角搭配建議`;
        subEl.textContent = ana.missing.length ? `尚缺分路：${ana.missing.join('、')}（支援彈性搖擺補位）` : '五路已齊全，可依康特與彈性搖擺調整';
        const lanes = ['自動', ...ALL_LANES];
        filterWrap.innerHTML = lanes.map(l => `
          <button onclick="setRecLane('${l}')" class="px-2 py-0.5 rounded text-xs cursor-pointer border ${state.recLaneFilter===l ? 'bg-amber-500 text-slate-950 font-bold border-amber-300' : 'bg-[#070d1c] border-slate-700 text-slate-300'}">${l}</button>
        `).join('');
      }

      alertsEl.innerHTML = ana.alerts.map(a => `
        <span class="px-2 py-0.5 rounded-full text-xs border border-slate-700 bg-[#070d1c] ${a.type==='warn'?'text-amber-300':'text-emerald-400'}">${a.text}</span>
      `).join('');

      const recs = getRecommendations(act.side, act.type, state.recLaneFilter).slice(0, 4);
      listEl.innerHTML = recs.map((r, i) => `
        <button onclick="applyHeroSelection('${r.hero.id}')"
          class="text-left p-2 rounded-lg border border-slate-700/80 bg-[#070d1c] hover:border-amber-400 transition cursor-pointer flex items-center justify-between gap-2">
          <div class="flex items-center gap-2 min-w-0">
            ${heroAvatarHtml(r.hero, 'w-8 h-8', false)}
            <div class="min-w-0">
              <div class="flex items-center gap-1">
                <span class="text-xs font-mono text-amber-400 font-bold">#${i+1}</span>
                <span class="text-xs font-bold text-white truncate">${r.hero.name}</span>
                <span class="text-xs text-slate-400">${r.hero.lanes[0]}</span>
              </div>
              <div class="text-xs text-emerald-400 truncate">${r.reasons.join('・')}</div>
            </div>
          </div>
          <div class="text-right shrink-0">
            <div class="text-xs font-mono font-bold text-slate-100">${r.hero.win}%</div>
            <div class="text-xs text-amber-300 font-bold">${act.type === 'ban' ? '禁用' : '鎖定'}</div>
          </div>
        </button>
      `).join('');
    }

    function renderHeroPool() {
      const lanes = ['全部', ...ALL_LANES];
      document.getElementById('laneTabs').innerHTML = lanes.map(l => `
        <button onclick="setLaneFilter('${l}')" class="px-2.5 py-1 rounded-lg text-xs font-bold cursor-pointer border transition ${state.laneFilter === l ? 'bg-amber-500 text-slate-950 border-amber-300' : 'bg-[#070d1c] border-slate-700 text-slate-300 hover:border-slate-500'}">${l}</button>
      `).join('');

      const act = getActiveAction();
      let list = HEROES.slice();
      if (state.laneFilter !== '全部') {
        list = list.filter(h => h.lanes.includes(state.laneFilter));
      }
      if (state.search.trim()) {
        const q = state.search.trim().toLowerCase();
        list = list.filter(h =>
          h.name.toLowerCase().includes(q) ||
          h.en.toLowerCase().includes(q) ||
          h.tags.some(t => t.toLowerCase().includes(q)) ||
          h.cls.includes(q) ||
          h.note.toLowerCase().includes(q)
        );
      }

      let scoreMap = {};
      if (act) {
        getRecommendations(act.side, act.type, '自動').forEach(r => { scoreMap[r.hero.id] = r.score; });
      }

      list.sort((a, b) => {
        if (state.sortBy === 'win') return b.win - a.win;
        if (state.sortBy === 'pro') return getModeScore(b) - getModeScore(a);
        if (state.sortBy === 'ban') return b.ban - a.ban;
        return (scoreMap[b.id] ?? getModeScore(b)) - (scoreMap[a.id] ?? getModeScore(a));
      });

      const scorePrefix = isRankedMode() ? '排' : '職';
      document.getElementById('heroGrid').innerHTML = list.map(h => {
        const used = isHeroUsed(h.id);
        const isPending = state.pendingHeroId === h.id;
        const mTier = getModeTier(h);
        const mScore = getModeScore(h);
        return `
          <button ${used || !act ? 'disabled' : `onclick="previewOrLockHero('${h.id}')" ondblclick="applyHeroSelection('${h.id}')"`}
            title="${h.note}"
            class="text-left p-1.5 rounded-lg border transition flex flex-col items-center gap-1 relative
            ${used ? 'opacity-30 cursor-not-allowed bg-slate-900 border-slate-800' :
              isPending ? 'aov-active-slot bg-amber-500/15 cursor-pointer' :
              'bg-[#081022] border-slate-700/80 hover:border-amber-400/80 cursor-pointer'}">
            <div class="w-full flex items-center justify-between">
              <span class="px-1 rounded text-xs font-bold ${tierBadgeColor(mTier)}">${mTier}</span>
              <span class="text-xs font-mono text-emerald-400">${h.win}%</span>
            </div>
            ${heroAvatarHtml(h, 'w-10 h-10', false)}
            <div class="text-xs font-bold text-slate-100 truncate w-full text-center">${h.name}</div>
            <div class="text-xs text-slate-400 truncate w-full text-center">${h.lanes[0]} · ${scorePrefix}${mScore}</div>
          </button>
        `;
      }).join('');
    }

    function renderPreviewBar() {
      const act = getActiveAction();
      const lockBtn = document.getElementById('lockBtn');
      const infoEl = document.getElementById('previewInfo');
      const h = state.pendingHeroId ? HERO_MAP[state.pendingHeroId] : null;

      if (!act) {
        lockBtn.disabled = true;
        lockBtn.textContent = 'BP 已完成';
        infoEl.innerHTML = '雙方陣容皆已鎖定，可點擊左右任一格移除重選';
        return;
      }

      if (h) {
        const mTier = getModeTier(h);
        const mScore = getModeScore(h);
        lockBtn.disabled = false;
        lockBtn.textContent = act.type === 'ban' ? `確定禁用 ${h.name}` : `確定鎖定 ${h.name}`;
        infoEl.innerHTML = `<b class="text-amber-300">${h.name}</b> (${h.lanes.join('/')}・${mTier})｜勝率 <b class="text-emerald-400">${h.win}%</b>・${isRankedMode()?'排位':'職評'} ${mScore}｜${h.note}`;
      } else {
        lockBtn.disabled = true;
        lockBtn.textContent = act.type === 'ban' ? '確定禁用' : '確定鎖定';
        infoEl.innerHTML = '點選英雄即可預覽，雙擊英雄或按右方金色按鈕確認（或勾選「單擊直接鎖定」）';
      }
    }

    function render() {
      const act = getActiveAction();
      const prob = computeWinProbability();

      // Header win-rate & banner
      document.getElementById('blueHeaderWin').textContent = `${prob.blueWin}%`;
      document.getElementById('redHeaderWin').textContent = `${prob.redWin}%`;
      document.getElementById('blueBar').style.width = `${prob.blueWin}%`;
      document.getElementById('redBar').style.width = `${prob.redWin}%`;

      const bannerEl = document.getElementById('turnBanner');
      if (!act) {
        bannerEl.innerHTML = `<span class="text-emerald-400">✔ 雙方 10 Ban 10 Pick 已完成！</span>`;
      } else if (state.mode === 'free') {
        const sTxt = act.side === 'blue' ? '藍方' : '紅方';
        const tTxt = act.type === 'ban' ? `第 ${act.slot+1} 禁` : `${act.slot+1}樓選角`;
        bannerEl.innerHTML = `<span class="${act.side==='blue'?'text-sky-300':'text-rose-300'}">自由模式 · 目前操作：${sTxt} ${tTxt}</span>`;
      } else {
        bannerEl.innerHTML = `<span class="text-amber-300 mr-1.5 font-mono">[${state.stepIdx+1}/20]</span><span class="${act.side==='blue'?'text-sky-300':'text-rose-300'}">${act.label}</span>`;
      }

      document.getElementById('blueBanCount').textContent = `${state.blueBans.filter(Boolean).length}/5`;
      document.getElementById('redBanCount').textContent = `${state.redBans.filter(Boolean).length}/5`;
      document.getElementById('bluePickCount').textContent = `${state.bluePicks.filter(Boolean).length}/5`;
      document.getElementById('redPickCount').textContent = `${state.redPicks.filter(Boolean).length}/5`;

      renderBanSlots('blueBans', state.blueBans, 'blue', act);
      renderBanSlots('redBans', state.redBans, 'red', act);
      renderPickSlots('bluePicks', state.bluePicks, 'blue', act, prob.blueA.assignments);
      renderPickSlots('redPicks', state.redPicks, 'red', act, prob.redA.assignments);

      renderTeamAnalytics('blueAnalytics', prob.blueA);
      renderTeamAnalytics('redAnalytics', prob.redA);
      renderTrendChart();
      renderPhaseBars(prob.blueA, prob.redA);
      renderRecommendations(prob);
      renderHeroPool();
      renderPreviewBar();

      document.getElementById('undoBtn').disabled = state.history.length === 0;
      document.getElementById('aiStepBtn').disabled = !act;
    }

    // Global callbacks
    window.clearSlot = clearSlot;
    window.previewOrLockHero = previewOrLockHero;
    window.applyHeroSelection = applyHeroSelection;
    window.setLaneFilter = l => { state.laneFilter = l; renderHeroPool(); };
    window.setRecLane = l => { state.recLaneFilter = l; renderRecommendations(computeWinProbability()); };

    // Events
    document.getElementById('modeSelect').addEventListener('change', e => { state.mode = e.target.value; resetDraft(); });
    document.getElementById('aiStepBtn').addEventListener('click', aiStep);
    document.getElementById('undoBtn').addEventListener('click', undo);
    document.getElementById('swapBtn').addEventListener('click', swapSides);
    document.getElementById('resetBtn').addEventListener('click', resetDraft);
    document.getElementById('instantLockChk').addEventListener('change', e => { state.instantLock = e.target.checked; });
    document.getElementById('lockBtn').addEventListener('click', () => {
      if (state.pendingHeroId) applyHeroSelection(state.pendingHeroId);
    });
    document.getElementById('searchInput').addEventListener('input', e => { state.search = e.target.value; renderHeroPool(); });
    document.getElementById('sortSelect').addEventListener('change', e => { state.sortBy = e.target.value; renderHeroPool(); });

    render();
  </script>
</body>
</html>
